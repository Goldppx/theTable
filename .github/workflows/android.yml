name: Build Android APK
on:
  pull_request:
  push:
    branches: [main, feat/flutter-md3-rewrite]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Create Android host project
        run: |
          flutter create --platforms=android --project-name=the_table --org=cn.edu.ncist.it .
          rm -f test/widget_test.dart
          python3 scripts/configure_android.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Install preview fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Test
        run: flutter test --timeout=2m
      - name: Build release APKs
        run: |
          flutter build apk --release --split-per-abi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/theTable-0.4.2-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/theTable-0.4.2-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/theTable-0.4.2-x86_64.apk
          cd dist
          sha256sum *.apk > SHA256SUMS
      - name: Enable Android emulator acceleration
        if: github.event_name == 'push'
        run: sudo chmod 666 /dev/kvm
      - name: Android 16 cold-start smoke test
        if: github.event_name == 'push'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r build/app/outputs/flutter-apk/app-x86_64-release.apk
            python3 scripts/android_startup_smoke.py
      - name: Upload Android startup evidence
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: theTable-android-startup-evidence
          path: build/startup-smoke/
          if-no-files-found: ignore
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: theTable-0.4.2-apks
          path: dist/
          retention-days: 30
      - name: Upload UI previews
        uses: actions/upload-artifact@v4
        with:
          name: theTable-ui-previews
          path: build/previews/
          if-no-files-found: ignore
      - name: Publish preview build
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/flutter-md3-rewrite'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: 'theTable 0.4.2 · Preview'
          prerelease: true
          body: |
            Fix expired/deleted cookie replay in WebView session restoration, retry and reauthentication.
            Preserve native-library extraction compatibility and WorkManager startup fixes.
            Official Flutter engine retained; requires device validation with injection excluded.
            Default blue palette, course/morning/API notifications, configurable app and mini-program URL shortcuts,
            AMap official URI campus map and native map application launch.
            Native CAS login and secure school session bridge are preserved.
            SSE is foreground-only; background JSON checks are system scheduled (minimum 15 minutes).
            Rain Classroom defaults to its official website; configure a valid WeChat URL Link in shortcut settings.
            School HTML timetable import is experimental and requires real-account validation.
            Android preview APKs use the Flutter development signing configuration.
          files: dist/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
