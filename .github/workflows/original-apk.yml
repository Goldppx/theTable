name: Original APK Dynamic Color
on:
  push:
    branches: [feat/original-apk-dynamic-color]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android tools
        run: sdkmanager 'build-tools;35.0.0' 'platforms;android-35'
      - name: Build and verify original APK patch
        run: bash scripts/build.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uem-original-dynamic-apk
          path: dist/
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Android 15 startup and dynamic palette
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell getprop ro.product.cpu.abilist
            adb install dist/uem-connect-1.1.1-dynamic.1-arm64.apk
            python3 scripts/smoke.py
      - name: Upload startup and color evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uem-original-dynamic-evidence
          path: build/smoke/
          if-no-files-found: ignore
      - name: Publish verification APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: original-dynamic-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: '应大通原版 1.1.1 · 动态取色验证版'
          prerelease: true
          body: |
            基于原版 v1.1.1 APK，保留原始 React Native/Hermes 界面与功能。
            Android 12+ 冷启动读取系统色板，替换浅/深主题的 18 项颜色常量。
            更换壁纸后彻底关闭应用再打开刷新取色。
            使用独立开发签名，包名沿用原版；真实学校登录与课表仍需手机验证。
          files: dist/*
